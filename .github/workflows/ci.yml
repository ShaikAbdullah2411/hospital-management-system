name: Hospital Management CI

on:
  push:
    branches:
      - feature/appointment-service

  pull_request:
    branches:
      - main

jobs:
  appointment-service-build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: AppointmentService/AppointmentService

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build AppointmentService
        run: mvn clean package
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push AppointmentService Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./AppointmentService/AppointmentService
          push: true
          tags: shaikabdullah2411/appointment-service:1.0

